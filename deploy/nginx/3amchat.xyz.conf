# /etc/nginx/conf.d/3amchat.xyz.conf
#
# 프론트(정적)와 백엔드(8080)를 한 서버에서 서빙한다. 8080은 방화벽에서 닫고
# Nginx만 80, 443으로 노출한다 — 앱이 인터넷에 직접 뜨지 않는다.
#
# 이 파일은 http 블록 안에 include 되므로 limit_*_zone 을 여기 둘 수 있다.

# 앞단 방어. 앱의 레이트리밋(도메인 규칙)을 대체하는 게 아니라 그 앞에 한 겹 더 두는 것이다 —
# Nginx는 본문을 못 읽어 이메일별 잠금이나 orderId별 쿨다운을 할 수 없다.
limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=api:10m     rate=10r/s;
limit_req_zone  $binary_remote_addr zone=auth:10m    rate=20r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# 기본값 503은 서버 장애로 읽힌다. 429가 의미상 맞고 프론트가 안내를 구분하기도 좋다.
limit_req_status  429;
limit_conn_status 429;

upstream threeam_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP는 인증서 갱신용 경로만 남기고 전부 HTTPS로 넘긴다
server {
    listen 80;
    listen [::]:80;
    # sites-enabled/default 를 지웠으므로 이 블록이 80번의 기본이 된다 —
    # 매칭 안 되는 Host(IP 직접 접근 등)도 여기로 들어와 HTTPS로 넘어간다.
    server_name 3amchat.xyz www.3amchat.xyz;

    # certbot --webroot 갱신이 이 경로를 쓴다. 리다이렉트보다 위에 있어야 한다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www → apex 정리. 주소가 하나여야 검색엔진도 PG 심사도 깔끔하다.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.3amchat.xyz;

    ssl_certificate     /etc/letsencrypt/live/3amchat.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3amchat.xyz/privkey.pem;

    return 301 https://3amchat.xyz$request_uri;
}

server {
    # http2 on; 은 nginx 1.25.1+ 문법이다. Ubuntu 24.04는 1.24라 listen에 붙인다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 3amchat.xyz;

    ssl_certificate     /etc/letsencrypt/live/3amchat.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3amchat.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/3am/dist;
    index index.html;

    # 텍스트만 주고받는 서비스다. 파일 업로드가 없어 기본 1MB도 과하다.
    client_max_body_size 256k;

    # 연결을 붙잡고 안 놓는 공격(Slowloris) 방어.
    # 채팅 LLM 응답이 최대 90초라 연결이 오래 열려 있어 낮게 잡으면 정상 사용자가 막힌다.
    limit_conn perip 20;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 파일명에 해시가 붙는 빌드 산출물이라 오래 캐시해도 안전하다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html은 캐시하면 배포해도 옛 화면이 남는다
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 브루트포스와 어뷰징이 몰리는 경로만 분당 단위로 조인다.
    # exact match(=)라 아래 location /api/ 보다 먼저 잡힌다.
    location = /api/auth/login {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/snippets/3am-proxy.conf;
    }

    location = /api/auth/guest {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/snippets/3am-proxy.conf;
    }

    location = /api/users/signup {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/snippets/3am-proxy.conf;
    }

    location = /api/users/email-verifications {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/snippets/3am-proxy.conf;
    }

    # /api/auth/reissue 는 여기에 걸린다. 액세스 토큰이 30분마다 만료돼 정상 사용 중에도
    # 자동 호출되므로 auth 존(분당)에 넣으면 오래 쓰는 사용자가 튕긴다.
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/snippets/3am-proxy.conf;
    }

    # 진단 공유 링크 — 이 경로만 백엔드가 OG 태그 박힌 HTML을 만든다. SPA는 JS를 돌려야
    # 내용이 생겨 카톡/페북 크롤러에게 미리보기가 비어 나온다. 사람은 그 HTML의 스크립트가
    # SPA 화면(/shared/)으로 보낸다.
    location /s/ {
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/snippets/3am-proxy.conf;
    }

    # react-router 경로(/payment/success 등)는 실제 파일이 없다 — index.html로 받는다.
    # 결제 성공 리다이렉트가 여기로 떨어지므로 빠지면 결제 완료 화면이 404가 된다.
    location / {
        limit_req zone=general burst=60 nodelay;
        try_files $uri $uri/ /index.html;
    }
}
