# /etc/nginx/snippets/3am-proxy.conf
#
# 백엔드로 넘기는 공통 설정. 경로마다 레이트리밋만 다르고 나머지는 같아서 따로 뺐다.

proxy_pass http://threeam_app;
proxy_http_version 1.1;
proxy_set_header Connection "";

# 가입, 로그인, 메일 발송 제한이 전부 IP 기준이라 실제 클라이언트 IP가 넘어가야 한다.
# 이게 없으면 모든 요청이 127.0.0.1로 보여 한 사람이 전체를 잠글 수 있다.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 진단 LLM 상한이 90초, spring.mvc.async.request-timeout이 120초다.
# Nginx 기본값 60초를 그대로 두면 정상 진단이 항상 504로 끊긴다.
proxy_connect_timeout 10s;
proxy_send_timeout    130s;
proxy_read_timeout    130s;

proxy_buffering off;
